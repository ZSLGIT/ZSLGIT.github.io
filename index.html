<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Z&L Blog</title>
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- Header -->
<header class="header" id="header">
    <div class="header-inner">
        <span class="logo-text" data-action="home">Z&L Blog</span>
        <ul class="nav-links">
            <li><a href="#" data-action="home">首页</a></li>
            <li><a href="#/about">关于</a></li>
        </ul>
    </div>
</header>

<!-- Layout (首页左右分栏) -->
<div class="layout">

<!-- Hero -->
<section class="hero" id="hero">
    <div class="hero-bg"></div>
    <img src="Logo.png" alt="Z&L Logo" class="hero-logo">
    <h1 class="hero-title">Z&L Blog</h1>
    <p class="hero-subtitle">分享技术、记录思考、探索世界</p>
</section>

<!-- Main -->
<main class="main">

    <!-- 文章列表视图 -->
    <div class="list-view" id="listView">
        <div class="section-header">
            <div class="section-head-left">
                <h2 class="section-title" id="sectionTitle">文章</h2>
                <div class="category-tabs" id="categoryTabs"></div>
            </div>
            <input class="search-box" id="searchInput" placeholder="搜索文章...">
        </div>
        <div class="post-grid" id="postGrid"></div>
    </div>

    <!-- 文章阅读视图 -->
    <div class="article-view" id="articleView">
        <div class="article-header">
        <div class="article-top">
        <a class="back-bar" data-action="back">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
            返回列表
        </a>
        <h1 class="article-title" id="articleTitle"></h1>
        </div><!-- /.article-top -->
        <div class="article-top">
            <div class="article-meta" id="articleMeta"></div>
            <div class="article-tags-row" id="articleTags"></div>
        </div>
        <div class="divider"></div>
        </div><!-- /.article-header -->
        <div class="markdown-body" id="articleContent">
            <div class="loading"><div class="spinner"></div><br>加载中...</div>
        </div>
    </div>

</main>

</div><!-- /.layout -->

<footer class="footer">
    &copy; 2026 Z&L Blog &middot; Powered by GitHub Pages E-mail:1127441883@qq.com
</footer>

<!-- 第三方依赖 -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.0/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.8/purify.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>

<!-- 应用逻辑（ES Module，从 js/main.js 入口加载，内部 import 各模块） -->
<script type="module" src="js/main.js"></script>

</body>
</html>
