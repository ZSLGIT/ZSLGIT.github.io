<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Z&L Blog</title>
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg-primary: #0a0a0f;
            --bg-secondary: #12121a;
            --bg-card: #16162a;
            --text-primary: #e8e8f0;
            --text-secondary: #9999b0;
            --accent: #6c63ff;
            --accent-light: #8b83ff;
            --border: #252540;
            --shadow: 0 4px 24px rgba(0,0,0,.3);
            --radius: 16px;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Noto Sans SC', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.7;
            min-height: 100vh;
        }

        /* ===== Header ===== */
        .header {
            position: fixed; top: 0; left: 0; right: 0;
            z-index: 100;
            backdrop-filter: blur(20px) saturate(180%);
            background: rgba(10,10,15,.75);
            border-bottom: 1px solid var(--border);
            transition: box-shadow .3s;
        }
        .header.scrolled { box-shadow: 0 2px 20px rgba(0,0,0,.5); }
        .header-inner {
            max-width: 1100px; margin: 0 auto;
            display: flex; align-items: center; justify-content: space-between;
            height: 64px; padding: 0 24px;
        }
        .logo-text {
            font-size: 20px; font-weight: 800;
            letter-spacing: -.5px;
            cursor: pointer;
            background: linear-gradient(135deg, #ff3d9a, #ffaa00, #00c8ff);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        .nav-links {
            display: flex; gap: 28px; list-style: none;
        }
        .nav-links a {
            color: var(--text-secondary); text-decoration: none;
            font-size: 14px; font-weight: 500;
            transition: color .2s;
        }
        .nav-links a:hover { color: var(--text-primary); }

        /* ===== Hero ===== */
        .hero {
            position: relative;
            min-height: 420px;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            overflow: hidden;
            margin-top: 64px;
        }
        .hero-bg {
            position: absolute; inset: 0;
            background:
                radial-gradient(ellipse at 30% 50%, rgba(108,99,255,.12) 0%, transparent 60%),
                radial-gradient(ellipse at 70% 50%, rgba(255,61,154,.08) 0%, transparent 60%);
        }
        .hero-logo {
            width: 260px; max-width: 80vw;
            filter: drop-shadow(0 8px 32px rgba(108,99,255,.35));
            animation: floatIn .8s ease-out both;
            z-index: 1;
        }
        @keyframes floatIn {
            from { opacity: 0; transform: translateY(24px) scale(.96); }
            to   { opacity: 1; transform: translateY(0) scale(1); }
        }
        .hero-title {
            font-size: clamp(26px, 4vw, 38px);
            font-weight: 800;
            margin-top: 20px;
            letter-spacing: -1px;
            z-index: 1;
            animation: fadeUp .8s ease-out .2s both;
        }
        .hero-subtitle {
            color: var(--text-secondary);
            font-size: 16px; margin-top: 8px;
            max-width: 480px; text-align: center;
            z-index: 1;
            animation: fadeUp .8s ease-out .35s both;
        }
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(14px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        /* ===== Main Content ===== */
        .main { max-width: 1100px; margin: 0 auto; padding: 48px 24px 80px; }

        /* Post List View */
        .section-header {
            display: flex; align-items: center; justify-content: space-between;
            margin-bottom: 32px;
        }
        .section-title {
            font-size: 22px; font-weight: 700;
        }
        .search-box {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 8px 16px;
            color: var(--text-primary);
            font-size: 14px; width: 220px;
            outline: none; transition: border-color .2s;
        }
        .search-box:focus { border-color: var(--accent); }
        .post-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 24px;
        }
        .post-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 28px;
            cursor: pointer;
            transition: transform .25s, box-shadow .25s, border-color .25s;
            text-decoration: none; color: inherit;
            display: block;
        }
        .post-card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow);
            border-color: rgba(108,99,255,.4);
        }
        .post-card-date {
            font-size: 13px; color: var(--accent-light);
            margin-bottom: 10px;
        }
        .post-card-title {
            font-size: 18px; font-weight: 700;
            line-height: 1.4; margin-bottom: 10px;
        }
        .post-card-desc {
            font-size: 14px; color: var(--text-secondary);
            display: -webkit-box; -webkit-line-clamp: 2;
            -webkit-box-orient: vertical; overflow: hidden;
        }
        .post-card-tags {
            display: flex; flex-wrap: wrap; gap: 8px;
            margin-top: 16px;
        }
        .tag {
            font-size: 12px; padding: 3px 10px;
            border-radius: 20px;
            background: rgba(108,99,255,.12);
            color: var(--accent-light);
            border: 1px solid rgba(108,99,255,.2);
        }

        /* Empty state */
        .empty-state {
            grid-column: 1 / -1;
            text-align: center; padding: 80px 20px;
            color: var(--text-secondary);
        }
        .empty-state svg { width: 64px; height: 64px; margin-bottom: 16px; opacity: .4; }

        /* Loading */
        .loading { text-align: center; padding: 60px; color: var(--text-secondary); }
        .spinner {
            display: inline-block; width: 32px; height: 32px;
            border: 3px solid var(--border); border-top-color: var(--accent);
            border-radius: 50%; animation: spin .7s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* ===== Article Reader ===== */
        .article-view { display: none; margin-top: 50px; }
        .article-view.active { display: block; }
        .list-view.hidden { display: none; }

        .back-bar {
            display: inline-flex; align-items: center; gap: 6px;
            color: var(--accent-light); text-decoration: none;
            font-size: 14px; font-weight: 500;
            margin-bottom: 28px; cursor: pointer;
            transition: color .2s;
        }
        .back-bar:hover { color: var(--text-primary); }

        .article-meta {
            margin-bottom: 8px; font-size: 14px; color: var(--accent-light);
        }
        .article-title {
            font-size: clamp(28px, 4vw, 42px);
            font-weight: 800; line-height: 1.25;
            margin-bottom: 12px; letter-spacing: -.5px;
        }
        .article-tags-row {
            display: flex; flex-wrap: wrap; gap: 8px;
            margin-bottom: 36px;
        }
        .divider {
            height: 1px; background: var(--border);
            margin-bottom: 36px;
        }

        /* Markdown rendered content */
        .markdown-body {
            font-size: 16px; line-height: 1.85;
            max-width: 760px;
        }
        .markdown-body h1, .markdown-body h2,
        .markdown-body h3, .markdown-body h4 {
            margin: 2em 0 .6em; font-weight: 700;
            line-height: 1.3;
        }
        .markdown-body h1 { font-size: 1.8em; }
        .markdown-body h2 { font-size: 1.45em; padding-bottom: .3em; border-bottom: 1px solid var(--border); }
        .markdown-body h3 { font-size: 1.2em; }
        .markdown-body p { margin: 1em 0; }
        .markdown-body a { color: var(--accent-light); text-decoration: underline; text-underline-offset: 3px; }
        .markdown-body a:hover { color: var(--accent); }
        .markdown-body img {
            max-width: 100%; border-radius: 10px;
            margin: 1.2em 0;
        }
        .markdown-body ul, .markdown-body ol { padding-left: 1.8em; margin: .8em 0; }
        .markdown-body li { margin: .3em 0; }
        .markdown-body blockquote {
            border-left: 4px solid var(--accent);
            padding: 12px 20px; margin: 1.2em 0;
            background: rgba(108,99,255,.06);
            border-radius: 0 10px 10px 0;
            color: var(--text-secondary);
        }
        .markdown-body code {
            background: rgba(108,99,255,.12);
            padding: 2px 7px; border-radius: 6px;
            font-size: .88em; font-family: 'Fira Code', 'Cascadia Code', monospace;
        }
        .markdown-body pre {
            background: #0d1117; border: 1px solid var(--border);
            border-radius: 12px; padding: 20px; overflow-x: auto;
            margin: 1.4em 0;
        }
        .markdown-body pre code {
            background: none; padding: 0;
            font-size: .85em; line-height: 1.65;
        }
        .markdown-body table {
            width: 100%; border-collapse: collapse; margin: 1.2em 0;
        }
        .markdown-body th, .markdown-body td {
            border: 1px solid var(--border); padding: 10px 14px;
            text-align: left;
        }
        .markdown-body th { background: var(--bg-secondary); font-weight: 600; }
        .markdown-body hr { border: none; border-top: 1px solid var(--border); margin: 2.5em 0; }

        /* ===== Footer ===== */
        .footer {
            text-align: center; padding: 32px 24px;
            color: var(--text-secondary); font-size: 13px;
            border-top: 1px solid var(--border);
        }

        /* ===== Responsive ===== */
        @media (max-width: 640px) {
            .header-inner { padding: 0 16px; }
            .hero { min-height: 340px; }
            .hero-logo { width: 200px; }
            .main { padding: 32px 16px 60px; }
            .post-grid { grid-template-columns: 1fr; }
            .search-box { width: 160px; }
            .section-header { flex-direction: column; gap: 16px; align-items: stretch; }
            .nav-links { display: none; }
        }
    </style>
</head>
<body>

<!-- Header -->
<header class="header" id="header">
    <div class="header-inner">
        <span class="logo-text" onclick="goHome()">Z&L Blog</span>
        <ul class="nav-links">
            <li><a href="#" onclick="goHome();return false">首页</a></li>
            <li><a href="#/about">关于</a></li>
        </ul>
    </div>
</header>

<!-- Hero -->
<section class="hero" id="hero">
    <div class="hero-bg"></div>
    <img src="Logo.png" alt="Z&L Logo" class="hero-logo">
    <h1 class="hero-title">Z&L Blog</h1>
    <p class="hero-subtitle">分享技术、记录思考、探索世界</p>
</section>

<!-- Main -->
<main class="main">

    <!-- 文章列表视图 -->
    <div class="list-view" id="listView">
        <div class="section-header">
            <h2 class="section-title">文章</h2>
            <input class="search-box" id="searchInput" placeholder="搜索文章..." oninput="filterPosts()">
        </div>
        <div class="post-grid" id="postGrid"></div>
    </div>

    <!-- 文章阅读视图 -->
    <div class="article-view" id="articleView">
        <a class="back-bar" onclick="goHome()">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
            返回列表
        </a>
        <div class="article-meta" id="articleMeta"></div>
        <h1 class="article-title" id="articleTitle"></h1>
        <div class="article-tags-row" id="articleTags"></div>
        <div class="divider"></div>
        <div class="markdown-body" id="articleContent">
            <div class="loading"><div class="spinner"></div><br>加载中...</div>
        </div>
    </div>

</main>

<footer class="footer">
    &copy; 2026 Z&L Blog &middot; Powered by GitHub Pages
</footer>

<!-- Scripts -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.0/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.8/purify.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>

<script>
// ========== 配置 ==========
const POSTS_INDEX = 'posts.json'; // 文章索引文件

// ========== 状态 ==========
let allPosts = [];

// ========== 初始化 ==========
document.addEventListener('DOMContentLoaded', () => {
    loadPosts();
    setupHeaderScroll();
    setupRouter();
});

// ========== Header 滚动效果 ==========
function setupHeaderScroll() {
    window.addEventListener('scroll', () => {
        document.getElementById('header').classList.toggle('scrolled', window.scrollY > 10);
    });
}

// ========== 加载文章列表 ==========
async function loadPosts() {
    const grid = document.getElementById('postGrid');
    try {
        const res = await fetch(POSTS_INDEX);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        allPosts = await res.json();
        renderPosts(allPosts);
    } catch (e) {
        grid.innerHTML = `<div class="empty-state">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M16 13H8M16 17H8M10 9H8"/></svg>
            <p>暂无文章<br><small style="opacity:.6">请创建 posts.json 配置文章索引</small></p>
        </div>`;
    }
}

function renderPosts(posts) {
    const grid = document.getElementById('pageGrid') || document.getElementById('postGrid');
    if (!posts.length) {
        grid.innerHTML = `<div class="empty-state"><p>没有找到匹配的文章</p></div>`;
        return;
    }
    grid.innerHTML = posts.map(p => `
        <a class="post-card" onclick="openPost('${p.file}')">
            <div class="post-card-date">${p.date || ''}</div>
            <div class="post-card-title">${escapeHtml(p.title)}</div>
            <div class="post-card-desc">${escapeHtml(p.description || '')}</div>
            ${p.tags ? `<div class="post-card-tags">${p.tags.map(t => `<span class="tag">${escapeHtml(t)}</span>`).join('')}</div>` : ''}
        </a>
    `).join('');
}

// ========== 搜索过滤 ==========
function filterPosts() {
    const q = document.getElementById('searchInput').value.trim().toLowerCase();
    if (!q) return renderPosts(allPosts);
    const filtered = allPosts.filter(p =>
        (p.title || '').toLowerCase().includes(q) ||
        (p.description || '').toLowerCase().includes(q) ||
        (p.tags || []).some(t => t.toLowerCase().includes(q))
    );
    renderPosts(filtered);
}

// ========== 打开文章 ==========
async function openPost(file) {
    showArticleView();
    document.getElementById('articleTitle').textContent = '';
    document.getElementById('articleMeta').textContent = '';
    document.getElementById('articleTags').innerHTML = '';
    document.getElementById('articleContent').innerHTML = '<div class="loading"><div class="spinner"></div><br>加载中...</div>';

    const post = allPosts.find(p => p.file === file);

    try {
        const res = await fetch(file);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        let md = await res.text();

        // 渲染 Markdown
        marked.setOptions({
            highlight(code, lang) {
                if (lang && hljs.getLanguage(lang)) {
                    return hljs.highlight(code, { language: lang }).value;
                }
                return hljs.highlightAuto(code).value;
            },
            breaks: true,
            gfm: true,
        });

        const html = DOMPurify.sanitize(marked.parse(md));

        if (post) {
            document.getElementById('articleMeta').textContent = post.date || '';
            document.getElementById('articleTitle').textContent = post.title;
            if (post.tags && post.tags.length) {
                document.getElementById('articleTags').innerHTML =
                    post.tags.map(t => `<span class="tag">${escapeHtml(t)}</span>`).join('');
            }
        }

        document.getElementById('articleContent').innerHTML = html;

        // 滚动到顶部
        window.scrollTo({ top: 0, behavior: 'smooth' });
    } catch (e) {
        document.getElementById('articleContent').innerHTML =
            `<div class="empty-state"><p>文章加载失败<br><small>${escapeHtml(e.message)}</small></p></div>`;
    }
}

// ========== 视图切换 ==========
function showArticleView() {
    document.getElementById('listView').classList.add('hidden');
    document.getElementById('articleView').classList.add('active');
    document.getElementById('hero').style.display = 'none';
}
function showListView() {
    document.getElementById('listView').classList.remove('hidden');
    document.getElementById('articleView').classList.remove('active');
    document.getElementById('hero').style.display = '';
}
function goHome() {
    showListView();
    history.pushState(null, '', location.pathname);
    window.scrollTo({ top: 0, behavior: 'smooth' });
}

// ========== 路由（Hash） ==========
function setupRouter() {
    window.addEventListener('hashchange', handleRoute);
    handleRoute();
}
function handleRoute() {
    const hash = location.hash.slice(1); // 去掉 #
    if (!hash) { showListView(); return; }
    const m = hash.match(/^\/post\/(.+)$/);
    if (m) openPost(decodeURIComponent(m[1]));
}

// ========== 工具函数 ==========
function escapeHtml(s) {
    if (!s) return '';
    const div = document.createElement('div');
    div.textContent = s;
    return div.innerHTML;
}
</script>

</body>
</html>
